# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List all available commands
    cmd: task --list-all

  ci:
    desc: Run full CI pipeline (deps, format, lint, test, e2e)
    cmds:
      - task: deps
      - task: format
      - task: lint
      - task: test
      - task: e2e

  deps:
    desc: Install dependencies for the project
    cmds:
      - go mod download

  docs:
    desc: Generate documentation site using veta
    dir: ./docs
    cmd: veta build

  build:
    desc: Build the project
    cmd: go build -o ./dist/rienda ./cmd/rienda/.

  format:
    desc: Format all code
    cmds:
      - dprint fmt --config ./dprint.json --log-level warn
      - golangci-lint fmt ./...

  lint:
    desc: Lint all code
    cmds:
      - dprint check --config ./dprint.json --log-level warn
      - golangci-lint run ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...
      - CGO_ENABLED=1 go test -race ./...

  e2e:
    desc: Run the black-box end-to-end test suite against the compiled binary
    cmd: go test -tags e2e -count=1 ./e2e/...
